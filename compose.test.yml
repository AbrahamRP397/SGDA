services:
  oracle-test:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sgda-oracle-test
    environment:
      ORACLE_PASSWORD: local_system_password
      APP_USER: SGDA_TEST
      APP_USER_PASSWORD: sgda_test_password
    ports:
      - "1521:1521"
    volumes:
      - ./docker/oracle/init:/container-entrypoint-initdb.d/startup:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

